<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" fill="none">
  <rect width="900" height="900" fill="#FAF8EC"/>
  <circle cx="450" cy="450" r="370" fill="#B96038" fill-opacity="0.14"/>
  <!-- Warm wooden desk -->
  <rect x="70" y="110" width="760" height="680" rx="48" fill="#52332A"/>
  <!-- Printed sheet on desk -->
  <rect x="180" y="165" width="490" height="570" rx="18" fill="#FFFFFF"/>
  <!-- Header bar -->
  <rect x="230" y="215" width="240" height="24" rx="12" fill="#015A67"/>
  <rect x="500" y="215" width="120" height="24" rx="12" fill="#81977A" fill-opacity="0.5"/>
  <!-- Checkboxes & lines -->
  <rect x="230" y="275" width="390" height="90" rx="12" fill="#FAF8EC"/>
  <rect x="255" y="300" width="28" height="28" rx="6" fill="#015A67"/>
  <rect x="305" y="306" width="230" height="16" rx="8" fill="#52332A" fill-opacity="0.7"/>
  <rect x="305" y="334" width="170" height="12" rx="6" fill="#81977A"/>

  <rect x="230" y="390" width="390" height="90" rx="12" fill="#FAF8EC"/>
  <rect x="255" y="415" width="28" height="28" rx="6" fill="#B96038"/>
  <rect x="305" y="421" width="210" height="16" rx="8" fill="#52332A" fill-opacity="0.7"/>
  <rect x="305" y="449" width="145" height="12" rx="6" fill="#81977A"/>

  <rect x="230" y="505" width="390" height="160" rx="12" fill="#FAF8EC"/>
  <rect x="255" y="535" width="180" height="16" rx="8" fill="#015A67"/>
  <rect x="255" y="575" width="280" height="12" rx="6" fill="#81977A"/>
  <rect x="255" y="610" width="195" height="12" rx="6" fill="#81977A"/>

  <!-- Left hand steadying the paper (skin tone #E89B69, sage sleeve #81977A) -->
  <path d="M70 430 L 185 385 C 215 375, 235 405, 220 435 L 145 520 L 70 510 Z" fill="#E89B69"/>
  <path d="M70 400 L 140 385 L 130 535 L 70 535 Z" fill="#81977A"/>

  <!-- Right hand holding terracotta/teal pen and filling in the line -->
  <g transform="translate(430, 470)">
    <!-- Pen -->
    <g transform="rotate(-35 80 80)">
      <rect x="65" y="-50" width="26" height="240" rx="13" fill="#015A67"/>
      <rect x="65" y="135" width="26" height="22" fill="#B96038"/>
      <polygon points="65,180 91,180 78,215" fill="#E89B69"/>
      <polygon points="73,200 83,200 78,215" fill="#52332A"/>
    </g>
    <!-- Hand & fingers -->
    <ellipse cx="145" cy="125" rx="82" ry="58" transform="rotate(-15 145 125)" fill="#E89B69"/>
    <rect x="55" y="88" width="85" height="32" rx="16" transform="rotate(-12 55 88)" fill="#E89B69"/>
    <rect x="62" y="118" width="85" height="32" rx="16" transform="rotate(-5 62 118)" fill="#E89B69"/>
    <!-- Teal sleeve cuff -->
    <path d="M205 110 L 395 210 L 330 320 L 155 185 Z" fill="#015A67"/>
  </g>
</svg>