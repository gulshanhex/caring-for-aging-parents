<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" fill="none">
  <!-- Warm cream background -->
  <rect width="1600" height="1000" fill="#FAF8EC"/>
  <!-- Soft ambient organic shapes -->
  <path d="M-80 180 C 200 -40, 660 20, 760 280 C 860 540, 520 740, 120 720 Z" fill="#81977A" fill-opacity="0.16"/>
  <path d="M1020 -60 C 1380 -40, 1680 160, 1660 520 C 1640 820, 1260 800, 1060 580 C 860 360, 740 -80, 1020 -60 Z" fill="#B96038" fill-opacity="0.12"/>
  
  <!-- Sunny arched kitchen window on left-center -->
  <rect x="140" y="90" width="380" height="470" rx="190" fill="#FFFFFF"/>
  <rect x="168" y="118" width="324" height="414" rx="162" fill="#FAF8EC"/>
  <!-- Soft sun rays & sage foliage outside window -->
  <circle cx="275" cy="225" r="54" fill="#B96038" fill-opacity="0.32"/>
  <path d="M168 420 Q 250 350 350 400 Q 430 440 492 380 L 492 532 L 168 532 Z" fill="#81977A" fill-opacity="0.55"/>
  <path d="M168 465 Q 290 420 492 455 L 492 532 L 168 532 Z" fill="#015A67" fill-opacity="0.35"/>
  <!-- Window panes divider (flat bars, no outlines) -->
  <rect x="323" y="118" width="14" height="414" fill="#FFFFFF"/>
  <rect x="168" y="325" width="324" height="14" fill="#FFFFFF"/>
  <!-- Potted sage plant on sill -->
  <path d="M195 450 C 180 410, 215 375, 240 420 C 255 370, 295 385, 280 435 C 310 405, 330 440, 290 468 Z" fill="#81977A"/>
  <path d="M218 462 L 278 462 L 268 522 C 266 530, 230 530, 228 522 Z" fill="#B96038"/>

  <!-- Adult daughter (45-60) seated warmly at center-right -->
  <!-- Flowing warm brown hair back layer -->
  <path d="M740 245 C 740 120, 955 115, 975 245 C 995 365, 1020 455, 985 520 C 950 565, 760 565, 730 510 C 705 455, 740 340, 740 245 Z" fill="#52332A"/>
  <!-- Cream highlight streak in hair (matching brand logo) -->
  <path d="M790 175 Q 875 210 950 205 Q 900 185 790 175 Z" fill="#FAF8EC" fill-opacity="0.85"/>
  <!-- Neck and shoulders -->
  <rect x="822" y="345" width="68" height="85" rx="30" fill="#E89B69"/>
  <!-- Soft shadow under chin -->
  <path d="M822 365 Q 856 392 890 365 L 890 385 Q 856 410 822 385 Z" fill="#B96038" fill-opacity="0.35"/>
  <!-- Teal cardigan/top -->
  <path d="M625 680 C 635 475, 725 415, 856 415 C 987 415, 1077 475, 1087 680 Z" fill="#015A67"/>
  <!-- Cream scoop neckline -->
  <path d="M785 415 Q 856 495 927 415 Z" fill="#E89B69"/>
  <!-- Head (soft flat oval) -->
  <rect x="782" y="185" width="148" height="186" rx="74" fill="#E89B69"/>
  <!-- Hair front sweep -->
  <path d="M775 245 C 780 165, 935 165, 940 250 C 900 220, 830 205, 780 265 Z" fill="#52332A"/>
  <!-- Calm closed-eye smile (simple flat shapes, matching logo) -->
  <path d="M812 272 Q 828 262 842 272" fill="#52332A"/>
  <rect x="812" y="268" width="28" height="6" rx="3" fill="#52332A"/>
  <rect x="872" y="268" width="28" height="6" rx="3" fill="#52332A"/>
  <!-- Gentle smile -->
  <path d="M836 322 Q 856 338 876 322 Q 856 330 836 322 Z" fill="#B96038"/>

  <!-- Left & right arms resting calmly on table -->
  <path d="M635 585 Q 585 660 695 695 L 745 655 Q 675 630 685 565 Z" fill="#015A67"/>
  <ellipse cx="735" cy="680" rx="36" ry="24" fill="#E89B69"/>
  <path d="M1070 585 Q 1120 660 1010 695 L 960 655 Q 1030 630 1020 565 Z" fill="#015A67"/>
  <ellipse cx="975" cy="680" rx="36" ry="24" fill="#E89B69"/>

  <!-- Warm brown kitchen table surface -->
  <path d="M80 650 L 1520 650 C 1560 650, 1580 680, 1580 720 L 1580 960 L 20 960 L 20 720 C 20 680, 40 650, 80 650 Z" fill="#52332A"/>
  <rect x="20" y="650" width="1560" height="24" rx="12" fill="#B96038" fill-opacity="0.45"/>

  <!-- Large-print printable sheet in front of her on table (perspective flat card) -->
  <g transform="translate(650, 680)">
    <!-- Second page underneath -->
    <rect x="-12" y="10" width="380" height="245" rx="12" transform="rotate(-3)" fill="#FAF8EC" fill-opacity="0.85"/>
    <!-- Top sheet -->
    <rect x="0" y="0" width="380" height="245" rx="12" fill="#FFFFFF"/>
    <!-- Teal top header bar on sheet -->
    <rect x="28" y="24" width="190" height="18" rx="9" fill="#015A67"/>
    <rect x="250" y="24" width="102" height="18" rx="9" fill="#81977A" fill-opacity="0.5"/>
    <!-- Large-print structured boxes and abstract bars -->
    <rect x="28" y="58" width="155" height="72" rx="8" fill="#FAF8EC"/>
    <rect x="40" y="72" width="90" height="10" rx="5" fill="#015A67" fill-opacity="0.7"/>
    <rect x="40" y="92" width="125" height="8" rx="4" fill="#81977A" fill-opacity="0.55"/>
    <rect x="40" y="108" width="105" height="8" rx="4" fill="#81977A" fill-opacity="0.55"/>

    <rect x="197" y="58" width="155" height="72" rx="8" fill="#FAF8EC"/>
    <rect x="209" y="72" width="85" height="10" rx="5" fill="#B96038" fill-opacity="0.75"/>
    <rect x="209" y="92" width="125" height="8" rx="4" fill="#81977A" fill-opacity="0.55"/>
    <rect x="209" y="108" width="110" height="8" rx="4" fill="#81977A" fill-opacity="0.55"/>

    <rect x="28" y="144" width="324" height="74" rx="8" fill="#FAF8EC"/>
    <rect x="42" y="160" width="140" height="10" rx="5" fill="#015A67" fill-opacity="0.7"/>
    <rect x="42" y="180" width="280" height="8" rx="4" fill="#81977A" fill-opacity="0.55"/>
    <rect x="42" y="196" width="230" height="8" rx="4" fill="#81977A" fill-opacity="0.55"/>
  </g>

  <!-- Terracotta pen beside the sheet -->
  <g transform="translate(1075, 745) rotate(22)">
    <rect x="0" y="0" width="18" height="150" rx="9" fill="#B96038"/>
    <rect x="0" y="20" width="18" height="14" fill="#FAF8EC"/>
    <polygon points="0,145 18,145 9,168" fill="#E89B69"/>
    <polygon points="6,160 12,160 9,168" fill="#015A67"/>
  </g>

  <!-- Smartphone lying flat on table to her right (calm screen, no text) -->
  <g transform="translate(465, 735) rotate(-8)">
    <rect x="0" y="0" width="96" height="168" rx="18" fill="#015A67"/>
    <rect x="8" y="14" width="80" height="140" rx="10" fill="#FAF8EC"/>
    <rect x="22" y="36" width="52" height="10" rx="5" fill="#81977A"/>
    <rect x="22" y="56" width="40" height="8" rx="4" fill="#B96038" fill-opacity="0.6"/>
    <rect x="22" y="76" width="52" height="44" rx="8" fill="#81977A" fill-opacity="0.25"/>
  </g>

  <!-- Warm cup of tea on right side of table -->
  <g transform="translate(1230, 710)">
    <ellipse cx="65" cy="112" rx="68" ry="20" fill="#81977A"/>
    <path d="M18 40 L 112 40 L 102 102 C 100 112, 30 112, 28 102 Z" fill="#FAF8EC"/>
    <path d="M108 52 C 132 52, 132 88, 104 88" fill="#FAF8EC"/>
    <ellipse cx="65" cy="40" rx="47" ry="11" fill="#B96038" fill-opacity="0.75"/>
    <!-- Gentle steam curls -->
    <path d="M48 22 C 42 5, 58 -5, 52 -22" fill="#FAF8EC" fill-opacity="0.4"/>
    <circle cx="52" cy="14" r="6" fill="#FAF8EC" fill-opacity="0.5"/>
    <circle cx="76" cy="4" r="8" fill="#FAF8EC" fill-opacity="0.4"/>
  </g>
</svg>