<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" fill="none">
  <rect width="900" height="900" fill="#FAF8EC"/>
  <circle cx="450" cy="450" r="360" fill="#81977A" fill-opacity="0.18"/>
  <circle cx="670" cy="240" r="95" fill="#B96038" fill-opacity="0.15"/>
  <!-- Desk surface -->
  <rect x="90" y="610" width="720" height="190" rx="36" fill="#52332A"/>
  <!-- Blank paper in top tray -->
  <rect x="285" y="150" width="330" height="180" rx="12" fill="#FFFFFF"/>
  <!-- Printer body -->
  <rect x="190" y="290" width="520" height="240" rx="42" fill="#015A67"/>
  <rect x="235" y="330" width="430" height="65" rx="20" fill="#81977A" fill-opacity="0.45"/>
  <!-- Indicator dots -->
  <circle cx="615" cy="362" r="11" fill="#FAF8EC"/>
  <circle cx="578" cy="362" r="11" fill="#B96038"/>
  <!-- Printer output slot -->
  <rect x="255" y="455" width="390" height="44" rx="12" fill="#52332A"/>
  <!-- Stack of printed large-print pages emerging onto desk -->
  <rect x="255" y="510" width="370" height="240" rx="14" transform="rotate(3 440 630)" fill="#FAF8EC"/>
  <rect x="265" y="485" width="370" height="245" rx="14" fill="#FFFFFF"/>
  <!-- Large print abstract bars on printed page -->
  <rect x="305" y="520" width="180" height="20" rx="10" fill="#015A67"/>
  <rect x="515" y="520" width="80" height="20" rx="10" fill="#B96038" fill-opacity="0.7"/>
  <rect x="305" y="562" width="290" height="44" rx="8" fill="#FAF8EC"/>
  <rect x="320" y="576" width="190" height="14" rx="7" fill="#81977A"/>
  <rect x="305" y="622" width="290" height="44" rx="8" fill="#FAF8EC"/>
  <rect x="320" y="636" width="220" height="14" rx="7" fill="#81977A"/>
  <rect x="305" y="682" width="160" height="14" rx="7" fill="#52332A" fill-opacity="0.5"/>
</svg>